<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Championship History Chart — MLB / NFL / NHL / NBA</title>
<style>
  @page {
    size: portrait;
    margin: 0.15in;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    margin: 0;
    padding: 8px;
    color: #111;
    background: #fff;
  }
  h1 {
    text-align: center;
    font-size: 34px;
    margin: 0 0 4px 0;
    letter-spacing: 1px;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 900;
    font-style: italic;
    background: linear-gradient(90deg, #C0111F, #002D72, #002868, #CE1141);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.08);
  }
  table {
    border-collapse: collapse;
    width: auto;
    margin: 0 auto;
    table-layout: fixed;
  }
  col.year-col { width: 48px; }
  col.sport-col { width: 260px; }
  thead {
    display: table-header-group;
  }
  tr {
    page-break-inside: avoid;
  }
  th {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    background: #111;
    color: #fff;
    padding: 7px 4px;
    text-align: center;
    border: 1px solid #000;
  }
  th .sport-icon {
    font-size: 18px;
    margin-right: 4px;
    vertical-align: middle;
  }
  th.year-col { white-space: nowrap; }
  td {
    border-left: 1px solid #999;
    border-right: 1px solid #999;
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #333;
    padding: 2px 5px;
    font-size: 9px;
    vertical-align: middle;
    text-align: center;
    position: relative;
  }
  td.year {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.3px;
    color: #4a3414;
    background: linear-gradient(180deg, #fffaf0, #f4e4bc);
    vertical-align: middle;
    border-right: 2px solid #c9a227;
    border-bottom: 1px solid #333;
  }
  td.empty {
    background: #fff;
    border: none;
  }
  td.noevent {
    color: #888;
    font-family: Arial, sans-serif;
    font-style: italic;
    font-size: 8px;
    vertical-align: middle;
    background: #e3e3e3;
    border-left: 1px solid #999;
    border-right: 1px solid #999;
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #333;
  }
  tr:nth-child(even) td.year {
    background: linear-gradient(180deg, #fdf3df, #ecd9a4);
  }
  tr:nth-child(even) td.noevent {
    background: #dcdcdc;
  }
  .result-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin: 0;
    line-height: 1.15;
    min-width: 0;
  }
  .trophy {
    font-size: 10px;
    line-height: 1;
    flex-shrink: 0;
    margin-right: -5px;
  }
  .champ {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 800;
    font-size: 11px;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    text-transform: uppercase;
    letter-spacing: 0.2px;
  }
  .titlecount {
    display: inline-block;
    font-size: 8px;
    font-weight: 900;
    vertical-align: super;
    margin-left: 0px;
    margin-right: 2px;
    opacity: 0.95;
  }
  .score {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 2px;
    padding: 2px 5px 0px 5px;
    line-height: 1;
    border-radius: 50%/50%;
    border: 1px solid;
    font-family: 'Courier New', monospace;
    font-weight: 900;
    font-size: 7.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .def-label {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 7.5px;
    opacity: 0.85;
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }
  .runner {
    display: inline-block;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: normal;
    font-size: 8px;
    padding: 1px 5px;
    border-radius: 2px;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    border: 1.5px solid;
    box-shadow: 0 2px 3px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .recline-champ {
    font-family: Arial, sans-serif;
    font-size: 7.5px;
    white-space: nowrap;
    flex-shrink: 0;
    opacity: 0.9;
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }
  .recline-runner {
    font-family: Arial, sans-serif;
    font-size: 7px;
    white-space: nowrap;
    flex-shrink: 0;
    opacity: 0.85;
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }
  .sbline {
    position: absolute;
    bottom: 1px;
    right: 3px;
    font-family: Arial, sans-serif;
    font-size: 8px;
    font-weight: bold;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }
  tr:last-child td {
    border-bottom: none;
  }
  @media print {
    body { padding: 0; }
    col.year-col { width: 32px; }
    col.sport-col { width: 185px; }
    h1 { font-size: 22px; }
    th {
      font-size: 9px;
      padding: 4px 2px;
      letter-spacing: 0.2px;
    }
    th .sport-icon {
      font-size: 11px;
      margin-right: 2px;
    }
    td {
      font-size: 7px;
      padding: 2px 3px;
      height: 30px;
    }
    td.year { font-size: 9px; }
    .result-line {
      flex-wrap: nowrap;
      gap: 2px;
      min-width: 0;
    }
    .champ {
      font-size: 7.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex-shrink: 1;
    }
    .runner {
      font-size: 6.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 1px 3px;
      min-width: 0;
      flex-shrink: 1;
      max-width: 100%;
    }
    .recline-champ {
      font-size: 6px;
      flex-shrink: 0;
    }
    .recline-runner {
      font-size: 5.5px;
      flex-shrink: 0;
    }
    .titlecount { font-size: 6px; }
    .sbline { font-size: 6px; }
    .def-label { font-size: 5.5px; flex-shrink: 0; }
    .score { font-size: 6px; }
    .trophy { font-size: 7px; }
  }
</style>
</head>
<body>
<h1>Champions of the Big Four — MLB &middot; NFL &middot; NHL &middot; NBA</h1>
<table>
  <colgroup>
    <col class="year-col">
    <col class="sport-col">
    <col class="sport-col">
    <col class="sport-col">
    <col class="sport-col">
  </colgroup>
  <thead>
    <tr>
      <th class="year-col"></th>
      <th><span class="sport-icon">&#9918;</span>MLB &ndash; World Series</th>
      <th><span class="sport-icon">&#127944;</span>NFL &ndash; Super Bowl</th>
      <th><span class="sport-icon">&#127954;</span>NHL &ndash; Stanley Cup</th>
      <th><span class="sport-icon">&#127936;</span>NBA &ndash; Finals</th>
    </tr>
  </thead>
  <tbody>
__ROWS__
  </tbody>
</table>
</body>
</html>
